<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja do Zé</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <header class="card-header">
            <h1>Loja do Zé</h1>
            <p class="subtitulo">Gerencie a categoria de produtos</p>
        </header>

        <main class="card-body">
            <nav aria-label="Seções"><a href="/" aria-current="page">Categorias</a><a href="/produtos.html">Produtos</a><a href="/clientes.html">Clientes</a></nav>
            <section>
                <h2 class="secao-titulo" id="titulo-form">Nova categoria</h2>
                <form id="form-categoria">
                    <input type="text" id="descricao" placeholder="Ex.: Brinquedos" required>
                    <button type="submit" id="btn-salvar">Cadastrar</button>
                    <button type="button" id="btn-limpar">Limpar</button>
                </form>
                <p id="mensagem"></p>
            </section>

            <section class="secao-lista">
                <h2 class="secao-titulo">Categorias</h2>
                <ul id="lista-categorias"></ul>
            </section>
        </main>
    </div>

    <!-- Abra por http://localhost:3001 (npm start), não pelo Live Server -->
    <script src="app.js"></script>
</body>
</html>
