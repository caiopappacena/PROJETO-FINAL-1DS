<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de cliente · Loja do Zé</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/clientes.js" defer></script>
</head>
<body><div class="card">
  <header class="card-header"><h1>Loja do Zé</h1><p class="subtitulo">Cadastro de clientes</p></header>
  <main class="card-body">
    <nav aria-label="Seções"><a href="/clientes.html" aria-current="page">Clientes</a><a href="/produtos.html">Cadastrar produtos</a></nav>
    <h2 class="secao-titulo">Novo cliente</h2>
    <form id="cliente">
      <label>Nome completo<input name="nome" autocomplete="name" maxlength="100" required></label>
      <label>E-mail<input name="email" type="email" autocomplete="email" maxlength="100" required></label>
      <label>Telefone com DDD<input name="telefone" type="tel" autocomplete="tel" placeholder="(15) 99999-9999" maxlength="24" required></label>
      <label>Endereço<input name="endereco" autocomplete="street-address" maxlength="150" required></label>
      <button id="btn-salvar">Cadastrar cliente</button>
    </form>
    <p id="mensagem" role="status"></p>
  </main>
</div></body>
</html>
