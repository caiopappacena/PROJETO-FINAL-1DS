<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produtos · Loja do Zé</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/produtos.js" defer></script>
</head>
<body>
  <div class="card">
    <header class="card-header"><h1>Loja do Zé</h1><p class="subtitulo">Cadastro de produtos</p></header>
    <main class="card-body">
      <nav aria-label="Seções"><a href="/">Categorias</a><a href="/produtos.html" aria-current="page">Produtos</a><a href="/clientes.html">Clientes</a></nav>
      <section>
        <h2 class="secao-titulo" id="titulo">Novo produto</h2>
        <form id="produto">
          <label>Nome<input name="nome" maxlength="100" required></label>
          <label>Preço (R$)<input name="preco" type="number" min="0" step="0.01" required></label>
          <label>Categoria<select name="categoria"><option value="">Sem categoria</option></select></label>
          <label>Validade<input type="date" name="validade"></label>
          <label>Descrição<textarea name="descricao" rows="2"></textarea></label>
          <div class="acoes"><button id="btn-salvar">Cadastrar</button><button type="button" id="btn-limpar">Limpar</button></div>
        </form>
        <p id="mensagem" role="status"></p>
      </section>
      <section class="secao-lista"><h2 class="secao-titulo">Produtos cadastrados</h2><ul id="produtos"></ul></section>
    </main>
  </div>
</body>
</html>
